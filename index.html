<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Licznik Produkcji Rolek</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Licznik Produkcji</h1>
            <p class="subtitle">Śledzenie produkcji rolek na zmianie</p>
        </header>

        <main>
            <!-- Formularz dodawania rolek -->
            <section class="add-section">
                <h2>Dodaj rolki</h2>
                <form id="addRollForm">
                    <div class="form-group">
                        <label for="weight">Waga rolki (kg) *</label>
                        <input
                            type="number"
                            id="weight"
                            step="0.01"
                            required
                            placeholder="np. 125.5"
                            autofocus>
                    </div>

                    <div class="form-group">
                        <label for="images">Liczba obrazków (opcjonalnie)</label>
                        <input
                            type="number"
                            id="images"
                            step="1"
                            placeholder="np. 1000">
                    </div>

                    <div class="form-group">
                        <label for="quantity">Ilość rolek *</label>
                        <input
                            type="number"
                            id="quantity"
                            value="1"
                            min="1"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary">➕ Dodaj</button>
                </form>
            </section>

            <!-- Podsumowanie -->
            <section class="summary-section">
                <h2>Podsumowanie zmiany</h2>
                <div class="summary-cards">
                    <div class="summary-card">
                        <div class="summary-label">Liczba rolek</div>
                        <div class="summary-value" id="totalRolls">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-label">Suma wag (kg)</div>
                        <div class="summary-value" id="totalWeight">0</div>
                    </div>
                    <div class="summary-card">
                        <div class="summary-label">Suma obrazków</div>
                        <div class="summary-value" id="totalImages">0</div>
                    </div>
                </div>
            </section>

            <!-- Lista rolek -->
            <section class="rolls-section">
                <div class="rolls-header">
                    <h2>Lista rolek</h2>
                    <button id="clearAllBtn" class="btn btn-danger btn-small" style="display: none;">
                        🗑️ Wyczyść wszystko
                    </button>
                </div>
                <div id="rollsList" class="rolls-list">
                    <p class="empty-message">Brak rolek. Dodaj pierwszą rolkę powyżej.</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Dane są zapisywane lokalnie w przeglądarce</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
